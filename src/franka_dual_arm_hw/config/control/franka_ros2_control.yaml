      - 2.0
      - 2.0
    command_interfaces: ["velocity"]
    joint_limit_position_tolerance: 0.02
    command_timeout: 0.2
    state_publish_rate: 20

# UI shim controllers (see controller_manager block above). Loaded inactive; they
