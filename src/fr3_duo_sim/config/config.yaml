# Everything not set here comes from fr3_duo_mock: description, SRDF, MoveIt
# parameters, controllers, Objectives (including the MuJoCo ones) and waypoints.
based_on_package: fr3_duo_mock

hardware:
  robot_description:
    # Overrides only these xacro arguments; the other inherited ones stay.
    urdf_params:
      - hardware_interface: "mujoco"
      - mujoco_model: "mjcf/scene.xml"
      - mujoco_viewer: "False"
